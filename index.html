<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotex Signal Tester</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        .btn { padding: 10px 20px; font-size: 16px; margin: 10px; cursor: pointer; }
        .btn-bullish { background-color: green; color: white; }
        .btn-bearish { background-color: red; color: white; }
        #signal-display { font-size: 24px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Quotex Signal Tester</h1>
    <button class="btn btn-bullish" onclick="showSignal('BULLISH')">BULLISH</button>
    <button class="btn btn-bearish" onclick="showSignal('BEARISH')">BEARISH</button>
    <div id="signal-display"></div>

    <script>
        function showSignal(signal) {
            document.getElementById('signal-display').innerText = 'Signal: ' + signal;
        }
    </script>
</body>
</html>
