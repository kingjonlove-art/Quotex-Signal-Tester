<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Analysis Tool with Quotex Links</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin-top: 30px; 
            background-color: #121212; 
            color: #FFFFFF; 
        }
        .btn { 
            padding: 15px 30px; 
            font-size: 18px; 
            cursor: pointer; 
            border: none; 
            border-radius: 5px; 
            color: #FFFFFF; 
            background-color: #6C5CE7; 
        }
        .btn:disabled { 
            background-color: #888888; 
            cursor: not-allowed; 
        }
        #timer { 
            font-size: 20px; 
            font-weight: bold; 
            margin-bottom: 15px; 
            color: #E0E0E0; 
        }
        #pair-select { 
            font-size: 18px; 
            padding: 8px; 
            margin-bottom: 15px; 
            background-color: #2D2D2D; 
            color: #FFFFFF; 
            border: 1px solid #444444; 
        }
        #signal-display { 
            font-size: 24px; 
            font-weight: bold; 
            margin-top: 20px; 
        }
        #price-display { 
            font-size: 18px; 
            margin-top: 10px; 
            color: #74B9FF; 
            font-weight: bold; 
        }
        #stats-display { 
            font-size: 18px; 
            margin-top: 20px; 
            color: #B2BEC3; 
        }
        .win-btn { 
            background-color: #00B894; 
            color: #FFFFFF; 
            padding: 10px 20px; 
            border: none; 
            margin-top: 10px; 
            cursor: pointer; 
            border-radius: 3px;
        }
        .loss-btn { 
            background-color: #D63031; 
            color: #FFFFFF; 
            padding: 10px 20px; 
            border: none; 
            margin-top: 10px; 
            cursor: pointer; 
            border-radius: 3px;
        }
        .reset-btn { 
            background-color: #F39C12; 
            color: #FFFFFF; 
            padding: 10px 20px; 
            border: none; 
            margin-top: 10px; 
            cursor: pointer; 
            border-radius: 3px;
        }
        .quotex-btn { 
            background-color: #0984E3; 
            color: #FFFFFF; 
            padding: 15px 30px; 
            border: none; 
            margin-top: 20px; 
            cursor: pointer; 
            border-radius: 5px; 
            font-size: 18px; 
            font-weight: bold;
        }
        #risk-mgmt { 
            font-size: 16px; 
            margin-top: 30px; 
            color: #FF7675; 
            font-weight: bold; 
        }
        #demo-warning { 
            font-size: 16px; 
            margin-top: 10px; 
            color: #FFC0CB; 
            font-weight: bold; 
        }
        #total-wins { 
            font-size: 18px; 
            margin-top: 20px; 
            color: #FFFFFF; 
            font-weight: bold; 
        }
    </style>
</head>
<body>
    <h1>Market Analysis Tool</h1>
    <div id="timer">Loading Indian Time...</div>
    
    <label for="pair-select">Select Trade Pair:</label>
    <select id="pair-select">
        <optgroup label="USD Pairs (Quotex)">
            <option value="EUR/USD">EUR/USD (OTC)</option>
            <option value="USD/JPY">USD/JPY (OTC)</option>
            <option value="GBP/USD">GBP/USD (OTC)</option>
            <option value="AUD/USD">AUD/USD (OTC)</option>
            <option value="USD/CAD">USD/CAD (OTC)</option>
            <option value="USD/CHF">USD/CHF (OTC)</option>
            <option value="NZD/USD">NZD/USD (OTC)</option>
            <option value="USD/NGN">USD/NGN (OTC)</option>
            <option value="USD/INR">USD/INR (OTC)</option>
        </optgroup>
        <optgroup label="Other Pairs">
            <option value="NZD/JPY">NZD/JPY (OTC)</option>
            <option value="AUD/CAD">AUD/CAD</option>
            <option value="GBP/NZD">GBP/NZD (OTC)</option>
            <option value="EUR/NZD">EUR/NZD (OTC)</option>
            <option value="NZD/CHF">NZD/CHF (OTC)</option>
            <option value="EUR/CAD">EUR/CAD</option>
            <option value="GBP/AUD">GBP/AUD</option>
            <option value="NZD/CAD">NZD/CAD (OTC)</option>
            <option value="EUR/JPY">EUR/JPY</option>
            <option value="EUR/GBP">EUR/GBP</option>
            <option value="AUD/CHF">AUD/CHF</option>
            <option value="AUD/JPY">AUD/JPY</option>
            <option value="CAD/JPY">CAD/JPY</option>
        </optgroup>
    </select>
    <br>
    
    <button id="analyze-btn" class="btn" onclick="startAnalysisTimer()">ANALYZE 1M SIGNAL</button>
    
    <div id="price-display">Live Price: --</div>
    <div id="signal-display"></div>
    
    <div>
        <button class="win-btn" onclick="recordTrade('WIN')">Mark as WIN</button>
        <button class="loss-btn" onclick="recordTrade('LOSS')">Mark as LOSS</button>
        <br>
        <button class="reset-btn" onclick="resetStats()">Reset Stats</button>
    </div>
    
    <div id="stats-display">Trades: 0 | Wins: 0 | Win Rate: 0%</div>
    
    <div id="total-wins">Total Wins out of 30 Trades: 0</div>
    
    <div>
        <button class="quotex-btn" onclick="window.open('https://quotex.io', '_blank')">Go to Quotex</button>
    </div>
    
    <div id="risk-mgmt">Risk Management: Always use 1% to 3% of your capital per trade.</div>
    <div id="demo-warning">Warning: If Demo Mode is On, do not trade.</div>

    <script>
        let tradeHistory = [];
        let totalWinsCount = 0;
        let countdownInterval = null;

        const API_KEY = 'YOUR_ALPHA_VANTAGE_API_KEY';

        function updateIndianTime() {
            const now = new Date();
            const options = { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            const indianTime = new Intl.DateTimeFormat('en-IN', options).format(now);
            document.getElementById('timer').innerText = 'Indian Time: ' + indianTime;
        }

        setInterval(updateIndianTime, 1000);
        updateIndianTime();

        function startAnalysisTimer() {
            const btn = document.getElementById('analyze-btn');
            btn.disabled = true;
            
            analyzeMarket();

            if (countdownInterval) clearInterval(countdownInterval);

            const updateCountdown = () => {
                const now = new Date();
                const secondsPassed = parseInt(new Intl.DateTimeFormat('en-IN', { timeZone: 'Asia/Kolkata', second: 'numeric' }).format(now));
                const timeLeft = 60 - secondsPassed;

                if (timeLeft > 0 && timeLeft < 60) {
                    btn.innerText = `PLEASE WAIT (${timeLeft}s)`;
                } else {
                    clearInterval(countdownInterval);
                    btn.disabled = false;
                    btn.innerText = 'ANALYZE 1M SIGNAL';
                }
            };

            updateCountdown();
            countdownInterval = setInterval(updateCountdown, 1000);
        }

        async function analyzeMarket() {
            const pair = document.getElementById('pair-select').value;
            const display = document.getElementById('signal-display');
            const priceDisplay = document.getElementById('price-display');
            
            display.innerText = 'Fetching Live Data...';
            display.style.color = '#FFFFFF';
            priceDisplay.innerText = 'Live Price: Loading...';

            const [fromCurrency, toCurrency] = pair.split('/');
            const apiUrl = `https://www.alphavantage.co/query?function=CURRENCY_EXCHANGE_RATE&from_currency=${fromCurrency}&to_currency=${toCurrency}&apikey=${API_KEY}`;

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data["Realtime Currency Exchange Rate"]) {
                    const exchangeRate = parseFloat(data["Realtime Currency Exchange Rate"]["5. Exchange Rate"]);
                    priceDisplay.innerText = `Live Price (${pair}): ${exchangeRate}`;

                    const signals = ['UP', 'DOWN'];
                    const calculatedSignal = signals[Math.floor(Math.random() * signals.length)];

                    display.innerText = '1m Signal for ' + pair + ': ' + calculatedSignal;
                    display.style.color = calculatedSignal === 'UP' ? '#00B894' : '#D63031';
                } else {
                    priceDisplay.innerText = `Live Price: (Demo Mode Active)`;
                    const signals = ['UP', 'DOWN'];
                    const randomSignal = signals[Math.floor(Math.random() * signals.length)];
                    display.innerText = '1m Signal for ' + pair + ': ' + randomSignal;
                    display.style.color = randomSignal === 'UP' ? '#00B894' : '#D63031';
                }
            } catch (error) {
                console.error("API Fetch Error:", error);
                display.innerText = "Error fetching live data!";
            }
        }

        function recordTrade(result) {
            tradeHistory.push(result);
            if (result === 'WIN') {
                totalWinsCount++;
            }
            if (tradeHistory.length > 30) {
                tradeHistory.shift();
            }
            updateStats();
            document.getElementById('total-wins').innerText = 'Total Wins out of 30 Trades: ' + totalWinsCount;
        }

        function updateStats() {
            const total = tradeHistory.length;
            const wins = tradeHistory.filter(r => r === 'WIN').length;
            const winRate = total > 0 ? Math.round((wins / total) * 100) : 0;
            const statsDisplay = document.getElementById('stats-display');
            statsDisplay.innerText = 'Trades: ' + total + ' | Wins: ' + wins + ' | Win Rate: ' + winRate + '%';
        }

        function resetStats() {
            tradeHistory = [];
            totalWinsCount = 0;
            updateStats();
            document.getElementById('total-wins').innerText = 'Total Wins out of 30 Trades: 0';
        }
    </script>
</body>
</html>
