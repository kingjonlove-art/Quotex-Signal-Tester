<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Analysis Demo</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 30px; }
        .btn { padding: 15px 30px; font-size: 18px; cursor: pointer; border: none; border-radius: 5px; color: white; background-color: purple; }
        #timer { font-size: 20px; font-weight: bold; margin-bottom: 15px; color: #333; }
        #pair-select { font-size: 18px; padding: 8px; margin-bottom: 15px; }
        #signal-display { font-size: 24px; font-weight: bold; margin-top: 20px; }
        #stats-display { font-size: 18px; margin-top: 20px; color: #555; }
        .win-btn { background-color: green; color: white; padding: 10px 20px; border: none; margin-top: 10px; cursor: pointer; }
        .loss-btn { background-color: red; color: white; padding: 10px 20px; border: none; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Market Analysis Tool</h1>
    <div id="timer">Loading Indian Time...</div>
    
    <label for="pair-select">Select Trade Pair:</label>
    <select id="pair-select">
        <!-- Add your currency pairs here -->
        <option value="USD/PHP">USD/PHP (OTC)</option>
        <!-- Add other options -->
    </select>
    <br>
    
    <button class="btn" onclick="analyzeMarket()">ANALYZE 1M SIGNAL</button>
    <div id="signal-display"></div>
    
    <div>
        <button class="win-btn" onclick="recordTrade('WIN')">Mark as WIN</button>
        <button class="loss-btn" onclick="recordTrade('LOSS')">Mark as LOSS</button>
    </div>
    
    <div id="stats-display">Trades: 0 | Wins: 0 | Win Rate: 0%</div>

    <script>
        let tradeHistory = [];

        function updateIndianTime() {
            const now = new Date();
            const options = { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            const indianTime = new Intl.DateTimeFormat('en-IN', options).format(now);
            document.getElementById('timer').innerText = 'Indian Time: ' + indianTime;
        }

        setInterval(updateIndianTime, 1000);
        updateIndianTime();

        function analyzeMarket() {
            const pair = document.getElementById('pair-select').value;
            const signals = ['UP', 'DOWN'];
            const randomSignal = signals[Math.floor(Math.random() * signals.length)];
            const display = document.getElementById('signal-display');
            display.innerText = '1m Signal for ' + pair + ': ' + randomSignal;
            display.style.color = randomSignal === 'UP' ? 'green' : 'red';
        }

        function recordTrade(result) {
            tradeHistory.push(result);
            if (tradeHistory.length > 10) {
                tradeHistory.shift();
            }
            updateStats();
        }

        function updateStats() {
            const total = tradeHistory.length;
            const wins = tradeHistory.filter(r => r === 'WIN').length;
            const winRate = total > 0 ? Math.round((wins / total) * 100) : 0;
            const statsDisplay = document.getElementById('stats-display');
            statsDisplay.innerText = 'Trades: ' + total + ' | Wins: ' + wins + ' | Win Rate: ' + winRate + '%';
        }
    </script>
</body>
</html>
